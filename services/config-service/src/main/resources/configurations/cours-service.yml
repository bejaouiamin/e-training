spring:
  datasource:
      url: jdbc:postgresql://localhost:5433/cours_db
      username: training       # ✓ Correct
      password: training       # ✓ Correct
      driver-class-name: org.postgresql.Driver
  jpa:
      hibernate:
        ddl-auto: update
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
      show-sql: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: cours-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.etraining"
        spring.json.type.mapping: "theme:com.etraining.ThemeCreatedEvent,lesson:com.etraining.LessonCreatedEvent,quiz:com.etraining.QuizCreatedEvent"
    properties:
      spring.json.add.type.headers: false

server:
  port: 8085
