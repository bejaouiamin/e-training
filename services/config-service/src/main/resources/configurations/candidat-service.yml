server:
  port: 8090
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/candidate_db
    username: training       # ✓ Correct
    password: training       # ✓ Correct
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  flyway:
    baseline-on-migrate: true
    enabled: true
    baseline-description: "init"
    baseline-version: 0
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}