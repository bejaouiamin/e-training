server:
  port: 8090
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/candidate_db
    username: training       # ✓ Correct
    password: training       # ✓ Correct
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.etraining.events"
        spring.json.value.default.type: com.etraining.events.QuizSubmittedEvent
      group-id: candidat-service
      auto-offset-reset: latest
    properties:
      spring.json.trusted.packages: "*"